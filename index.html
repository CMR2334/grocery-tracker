  :root{
    --bg:#f5f3ee; --card:#faf8f4; --ink:#373733; --muted:#696862; --line:#deded7;
    --title:#403e39; --primary:#6b6962; --primary-ink:#faf8f4;
    --c:#2563eb; --c-bg:#eaf0fe; --c-btn:#6d89cf;
    --s:#7c3aed; --s-bg:#f1eafe; --s-btn:#9682cd;
    --sh:#0f9d8f; --sh-bg:#e4f5f3; --sh-btn:#55998f;
    --green:#4d7055; --green-bg:#e8f0e8;
    --amber:#806035; --amber-bg:#f3ebdc;
    --red:#92534f; --red-bg:#f5e7e4;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  html{-webkit-text-size-adjust:100%;}
  #app{max-width:540px; margin:0 auto; padding:14px 16px 110px;
    padding-top:max(14px, env(safe-area-inset-top));
    padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right));}
  h1{font-size:22px; margin:0; letter-spacing:-.02em; color:var(--title);}
  .home-title{display:flex; align-items:center; gap:8px; min-width:0;}
  #appIconSlot{width:26px; height:26px; flex:none;}
  .home-title h1{font-family:'Fraunces',Georgia,"Times New Roman",serif; font-weight:600; letter-spacing:-.015em;}
  h2{font-size:12px; margin:26px 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:600;}
  .ic{width:18px; height:18px; flex:none;}
  .iconbtn .ic{width:19px; height:19px;}
  .banner .ic{vertical-align:-4px; margin-right:2px;}
  .hint{font-size:12.5px; color:var(--muted); margin:-2px 0 10px; line-height:1.5;}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0 14px;}
  .topbar .side{display:flex; gap:8px; align-items:center;}
  .topbar .trip-side{flex:1; min-width:0;}
  .trip-title{min-width:0;}
  .trip-title h1,.trip-title .small{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .store-badge{display:inline-flex; align-items:center; justify-content:center; flex:none; width:24px; height:24px; border-radius:8px; overflow:hidden; line-height:0;}
  .store-badge-trip{width:30px; height:30px;}
  .store-badge-home{width:24px; height:24px;}
  .store-badge{position:relative;}
  .store-badge .store-mark{display:block; width:100%; height:100%;}
  .store-badge .store-logo{position:absolute; inset:0; z-index:1; display:block; width:100%; height:100%; object-fit:cover; opacity:0; background:var(--card);}
  .store-badge .store-logo.loaded{opacity:1;}
  .iconbtn{border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:12px; padding:9px 12px; font-size:16px; cursor:pointer; line-height:1;
    min-height:44px; display:inline-flex; align-items:center; justify-content:center;}
  .btn{display:flex; width:100%; align-items:center; justify-content:center; gap:7px; border:none; border-radius:13px; padding:15px;
    font-size:16px; font-weight:600; cursor:pointer; text-align:center; font-family:inherit;}
  .btn-primary{background:var(--primary); color:var(--primary-ink);}
  .btn-primary:disabled{opacity:.45;}
  .btn-ghost{background:var(--card); color:var(--ink); border:1px solid var(--line);}
  .btn-sm{display:inline-flex; width:auto; padding:9px 13px; font-size:13.5px; border-radius:10px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:12px;}
  .muted{color:var(--muted);}
  .small{font-size:12.5px;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .grow{flex:1; min-width:0;}
  .in{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:11px;
    font-size:16px; background:var(--bg); color:var(--ink); font-family:inherit;}
  .in:focus{outline:2px solid var(--c); outline-offset:0;}
  input[type="number"]{-moz-appearance:textfield;}
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
  .in-money{width:96px; text-align:center; padding:8px 10px;}
  .in-qty{width:64px; text-align:center; padding:8px 6px;}
  .money-input{display:inline-flex; align-items:center; gap:5px; flex:none;}
  .money-prefix{color:var(--muted); font-size:13px;}
  label.flabel{display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin:12px 0 5px;}

  /* segmented control */
  .seg{display:flex; background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:3px; gap:3px;}
  .seg button{flex:1; border:none; background:transparent; color:var(--muted); font-weight:600;
    font-size:13.5px; padding:9px 4px; min-height:44px; display:flex; align-items:center; justify-content:center;
    border-radius:8px; cursor:pointer; font-family:inherit;}
  .seg button.on-C{background:var(--c-btn); color:#fff;}
  .seg button.on-S{background:var(--s-btn); color:#fff;}
  .seg button.on-SH{background:var(--sh-btn); color:#fff;}

  .chip{display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:8px 12px; min-height:44px;
    font-size:12px; font-weight:600; border:1px solid var(--line); background:var(--bg); color:var(--muted); cursor:pointer;}
  .chip.on{background:var(--amber-bg); color:var(--amber); border-color:transparent;}
  .qtybadge{display:inline-block; background:var(--bg); border:1px solid var(--line); color:var(--muted);
    font-size:12px; font-weight:700; border-radius:7px; padding:2px 7px; vertical-align:1px;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%;}
  .dot-C{background:var(--c);} .dot-S{background:var(--s);} .dot-SH{background:var(--sh);}
  .money{font-variant-numeric:tabular-nums; font-weight:600;}

  .banner{border-radius:12px; padding:11px 13px; font-size:13.5px; margin-bottom:12px; line-height:1.45;}
  .banner-ok{background:var(--green-bg); color:var(--green);}
  .banner-warn{background:var(--amber-bg); color:var(--amber);}
  .banner-err{background:var(--red-bg); color:var(--red);}
  .banner-info{background:var(--c-bg); color:var(--c);}

  .itemname{font-weight:600; font-size:14.5px; line-height:1.35; overflow-wrap:anywhere;}

<body>
<div id="app"></div>
<div id="toast"></div>
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Expanded screenshot"
  onclick="if(event.target===this) A.closeLightbox()">
  <img id="lightboxImage" alt="">
  <button class="lightbox-close" type="button" onclick="A.closeLightbox()" aria-label="Close expanded screenshot">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6.5 6.5 11 11"/><path d="m17.5 6.5-11 11"/></svg>
  </button>
</div>
<script>
"use strict";
/* ============================================================
   Grocery Splitter
   Splits grocery receipts between Collin / Steph / Shared and
   produces copy-paste rows for the Google Sheet (value ⇥ desc).
   All math is deterministic in this file; the AI only extracts
   items/fees/tax/promos from the screenshots.
   ============================================================ */

// ---------- helpers ----------
const $ = id => document.getElementById(id);
let _idc = 0;
const uid = () => 'x' + Date.now().toString(36) + (_idc++).toString(36) + Math.random().toString(36).slice(2,6);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const round2 = v => Math.round(num(v) * 100) / 100;
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// keep parenthetical suffixes like "(4 oz)" on one line when names wrap
const escName = s => esc(s).replace(/\(([^)]*)\)/g, m => m.replace(/ /g, '\u00a0'));
const money = cents => (cents < 0 ? '-' : '') + '$' + (Math.abs(cents)/100).toFixed(2);
const moneyN = n => money(Math.round(n*100));

const _sv = p => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
const IC = {
  gear:  _sv('<path d="M4 7h9"/><path d="M17 7h3"/><path d="M4 17h3"/><path d="M11 17h9"/><circle cx="15" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/>'),
  plus:  _sv('<path d="M12 5v14"/><path d="M5 12h14"/>'),
  back:  _sv('<path d="M14.5 5.5 8 12l6.5 6.5"/>'),
  trash: _sv('<path d="M5 7h14"/><path d="M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"/><path d="M7 7l1 12h8l1-12"/><path d="M10.5 10.5v5"/><path d="M13.5 10.5v5"/>'),
  copy:  _sv('<rect x="8.6" y="8.6" width="10.4" height="10.4" rx="2.4"/><path d="M15.4 5.4V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6.4a2 2 0 0 0 2 2h.4"/>'),
  image: _sv('<rect x="4" y="5" width="16" height="14" rx="2.6"/><circle cx="9.2" cy="10" r="1.7"/><path d="m5.5 16.5 4-4 3 3 2.8-2.8 3.2 3.2"/>'),
  eye:   _sv('<path d="M3.5 12S6.8 6.2 12 6.2 20.5 12 20.5 12 17.2 17.8 12 17.8 3.5 12 3.5 12Z"/><circle cx="12" cy="12" r="2.6"/>'),
  x:     _sv('<path d="m6.5 6.5 11 11"/><path d="m17.5 6.5-11 11"/>'),
  check: _sv('<path d="m5.5 12.5 4.2 4.2 8.8-9.2"/>')
};

const _sm = p => '<svg class="store-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">' + p + '</svg>';
const STORE_MARKS = {
  aldi: _sm('<rect width="32" height="32" rx="7" fill="#00457c"/><path d="m8 24 5.7-16h4.6L24 24h-4l-1.1-3.4h-5.6L12 24H8Zm6.4-6.2h3.4L16.1 13l-1.7 4.8Z" fill="#fff"/><path d="M8 26h16" fill="none" stroke="#f58220" stroke-width="2" stroke-linecap="round"/>'),
  woodmans: _sm('<rect width="32" height="32" rx="7" fill="#218447"/><path d="M6.5 8h3.8l2.1 9.8L15 8h3l2.6 9.8L22.8 8h3.7l-3.8 16h-3.7L16.5 14 14 24h-3.7L6.5 8Z" fill="#fff"/>'),
  picknsave: _sm('<rect width="32" height="32" rx="7" fill="#d71920"/><path d="M9 24V8h6.7a5.5 5.5 0 0 1 0 11H13v5H9Zm4-9h2.3a2 2 0 1 0 0-4H13v4Z" fill="#fff" fill-rule="evenodd"/>'),
  walmart: _sm('<rect width="32" height="32" rx="7" fill="#0071ce"/><g fill="none" stroke="#ffc220" stroke-width="2.6" stroke-linecap="round"><path d="M16 5.5v5.1M25.1 10.5l-4.4 2.55M25.1 21.5l-4.4-2.55M16 26.5v-5.1M6.9 21.5l4.4-2.55M6.9 10.5l4.4 2.55"/></g><circle cx="16" cy="16" r="2" fill="#ffc220"/>'),
  target: _sm('<rect x=".5" y=".5" width="31" height="31" rx="7" fill="#fff" stroke="var(--line)" stroke-width="1"/><circle cx="16" cy="16" r="8.7" fill="none" stroke="#cc0000" stroke-width="3.4"/><circle cx="16" cy="16" r="3.1" fill="#cc0000"/>'),
  costco: _sm('<rect x=".5" y=".5" width="31" height="31" rx="7" fill="#fff" stroke="var(--line)" stroke-width="1"/><path d="M24 8C13 5 8 9 8 16s5 11 16 8" fill="none" stroke="#c8102e" stroke-width="4.5" stroke-linecap="round"/>'),
  instacart: _sm('<rect x=".5" y=".5" width="31" height="31" rx="7" fill="#fff" stroke="var(--line)" stroke-width="1"/><path d="M19.4 7.2c-4.2 1.5-8.5 4.8-9.1 8.9-.6 4.1 2.3 7 6.2 7.1 4.3.1 7-3.3 5.9-7.1-.6-2.4-1.8-5.2-3-8.9Z" fill="#43b02a" transform="rotate(11 16 16)"/><path d="M15.2 20.5c1.8-1.2 3-3.2 3.4-5.7" fill="none" stroke="#f7931e" stroke-width="2.2" stroke-linecap="round" transform="rotate(11 16 16)"/>')
};
const STORE_MARK_FALLBACK = _sm('<rect x=".5" y=".5" width="31" height="31" rx="7" fill="var(--card)" stroke="var(--line)" stroke-width="1"/><path d="M7 13h18l-1.7-5H8.7L7 13Zm1 0v11h16V13M12 24v-6h4v6" fill="none" stroke="var(--muted)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 9v4M16 9v4M21 9v4" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-linecap="round"/>');
const STORE_MARK_ALIASES = [
  ['aldi', 'aldi'], ['woodman', 'woodmans'],
  ['picknsave', 'picknsave'], ['pickandsave', 'picknsave'], ['picksave', 'picknsave'],
  ['metromarket', 'metromarket'], ['kroger', 'metromarket'],
  ['walmart', 'walmart'], ['target', 'target'], ['costco', 'costco'], ['instacart', 'instacart']
];

function canonicalStoreId(name){
  const normalized = String(name ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
  return STORE_MARK_ALIASES.find(([alias]) => normalized.includes(alias))?.[1] || '';
}

function storeMarkFor(name){
  return STORE_MARKS[canonicalStoreId(name)] || STORE_MARK_FALLBACK;
}

function storeBadgeMarkup(name){
  const id = canonicalStoreId(name);
  if(!isSyncOn() || !id) return storeMarkFor(name);
  const logoUrl = `${syncBase()}/logos/${id}.png`;
  return `${storeMarkFor(name)}<img class="store-logo" src="${esc(logoUrl)}" alt="" aria-hidden="true" onload="this.classList.add('loaded')" onerror="this.style.display='none'">`;
}

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1600);
}

async function copyText(str, okMsg){
  try{
    await navigator.clipboard.writeText(str);
    toast(okMsg || 'Copied');
  }catch(e){
    // fallback for non-secure contexts
    const ta = document.createElement('textarea');
    ta.value = str; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(okMsg || 'Copied'); }
    catch(e2){ toast('Copy failed'); }
    ta.remove();
  }
}

// ---------- state ----------
const CATS = [ {k:'C', label:'Collin'}, {k:'SH', label:'Shared'}, {k:'S', label:'Steph'} ];
const CAT_LABEL = {C:'Collin', S:'Steph', SH:'Shared'};

function load(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
const loadedSettings = load('gt_settings', {});
let settings = Object.assign({ apiKey:'', model:'claude-opus-5', syncUrl:'', syncToken:'' }, loadedSettings && typeof loadedSettings === 'object' ? loadedSettings : {});
const loadedTrips = load('gt_trips', []);
let trips    = Array.isArray(loadedTrips) ? loadedTrips : [];
const loadedTombstones = load('gt_tombstones', []);
let tombstones = Array.isArray(loadedTombstones) ? loadedTombstones : [];
let syncRev = Number(load('gt_sync_rev', 0));
if(!Number.isFinite(syncRev) || syncRev < 0) syncRev = 0;
let syncState = load('gt_sync_state', { lastSyncAt:0, lastError:'' });
if(!syncState || typeof syncState !== 'object') syncState = { lastSyncAt:0, lastError:'' };
syncState = {
  lastSyncAt: Number.isFinite(Number(syncState.lastSyncAt)) ? Number(syncState.lastSyncAt) : 0,
  lastError: String(syncState.lastError || '')
};
settings.syncUrl = String(settings.syncUrl || '').trim().replace(/\/+$/, '');
settings.syncToken = String(settings.syncToken || '').trim();
let pendingImages = [];      // data URLs for the new-trip flow
const tripImages = Object.create(null); // session-only screenshots keyed by trip id
let lightboxScrollY = 0;
let lightboxReturnFocus = null;
let newTripDragDepth = 0;
let parsing = false;
let editItemId = null;
let editPromoId = null;
let currentTripId = null;
let currentView = 'home';
let syncPushTimer = null;
let syncPullInFlight = null;
let syncPushInFlight = null;
let syncNowInFlight = null;
let syncRenderPending = false;
const tripScreenshotLoadInFlight = new Map();
const lastPersistedTripBodies = new Map();

window.addEventListener('dragend', () => {
  newTripDragDepth = 0;
  document.querySelector('.newtrip-drop')?.classList.remove('dragging');
});

function tripUpdatedAt(t){
  const updated = Number(t?.updatedAt);
  if(Number.isFinite(updated)) return updated;
  const created = Number(t?.createdAt);
  return Number.isFinite(created) ? created : 0;
}

function ensureTripUpdatedAt(t, fallback = Date.now()){
  if(!t || typeof t !== 'object') return t;
  if(!Number.isFinite(Number(t.updatedAt))){
    const created = Number(t.createdAt);
    t.updatedAt = Number.isFinite(created) ? created : fallback;
  }
  return t;
}

function canonicalizeForSync(value){
  if(Array.isArray(value)) return value.map(canonicalizeForSync);
  if(value && typeof value === 'object'){
    const out = {};
    for(const key of Object.keys(value).sort()) out[key] = canonicalizeForSync(value[key]);
    return out;
  }
  return value;
}

function tripBodyForSync(t){
  const copy = JSON.parse(JSON.stringify(t));
  delete copy.updatedAt;
  return JSON.stringify(canonicalizeForSync(copy));
}

function dedupeTombstones(list){
  const byId = new Map();
  for(const raw of Array.isArray(list) ? list : []){
    if(!raw || raw.id == null || raw.id === '') continue;
    const id = String(raw.id);
    const deletedAt = Number(raw.deletedAt);
    const next = { id, deletedAt: Number.isFinite(deletedAt) ? deletedAt : 0 };
    const prior = byId.get(id);
    if(!prior || next.deletedAt >= prior.deletedAt) byId.set(id, next);
  }
  return [...byId.values()].sort((a,b) => a.id.localeCompare(b.id));
}

function syncStateSignature(tripList, tombstoneList){
  const state = {
    trips: (Array.isArray(tripList) ? tripList : [])
      .map(t => ensureTripUpdatedAt(t))
      .sort((a,b) => String(a.id).localeCompare(String(b.id))),
    tombstones: dedupeTombstones(tombstoneList)
  };
  return JSON.stringify(canonicalizeForSync(state));
}

function hasTripImages(id){
  return Object.prototype.hasOwnProperty.call(tripImages, id);
}

function isUserEditing(){
  if(editItemId !== null || editPromoId !== null) return true;
  const app = $('app');
  const active = document.activeElement;
  return !!(app && active && app.contains(active) && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA'));
}

function clearSyncPushTimer(){
  clearTimeout(syncPushTimer);
  syncPushTimer = null;
}

function persist(options = {}){
  const stampChanges = options.stampChanges !== false;
  if(stampChanges){
    const now = Date.now();
    for(const t of trips){
      ensureTripUpdatedAt(t, now);
      if(lastPersistedTripBodies.get(t.id) !== tripBodyForSync(t)) t.updatedAt = now;
    }
  }else{
    for(const t of trips) ensureTripUpdatedAt(t);
  }
  tombstones = dedupeTombstones(tombstones);
  try{
    localStorage.setItem('gt_settings', JSON.stringify(settings));
    localStorage.setItem('gt_trips', JSON.stringify(trips));
    localStorage.setItem('gt_tombstones', JSON.stringify(tombstones));
    lastPersistedTripBodies.clear();
    for(const t of trips) lastPersistedTripBodies.set(t.id, tripBodyForSync(t));
  }catch(e){ toast('Could not save'); }
  if(isSyncOn() && options.schedule !== false) schedulePush();
  if(!isSyncOn()) clearSyncPushTimer();
}

let initialStateNeedsPersist = false;
for(const t of trips){
  const before = t && t.updatedAt;
  ensureTripUpdatedAt(t);
  if(before !== t.updatedAt) initialStateNeedsPersist = true;
}
const normalizedTombstones = dedupeTombstones(tombstones);
if(JSON.stringify(normalizedTombstones) !== JSON.stringify(tombstones)) initialStateNeedsPersist = true;
tombstones = normalizedTombstones;

function openLightbox(url, alt){
  if(!url) return;
  const box = $('lightbox');
  const img = $('lightboxImage');
  lightboxScrollY = window.scrollY;
  lightboxReturnFocus = document.activeElement;
  img.src = url;
  img.alt = alt || 'Screenshot';
  box.classList.add('open');
  box.setAttribute('aria-hidden', 'false');
  document.body.style.top = `-${lightboxScrollY}px`;
  document.body.classList.add('lightbox-open');
  box.querySelector('.lightbox-close').focus();
}

function closeLightbox(){
  const box = $('lightbox');
  if(!box.classList.contains('open')) return;
  box.classList.remove('open');
  box.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('lightbox-open');
  document.body.style.top = '';
  window.scrollTo(0, lightboxScrollY);
  $('lightboxImage').removeAttribute('src');
  if(lightboxReturnFocus?.isConnected) lightboxReturnFocus.focus();
  lightboxReturnFocus = null;
}

// ---------- core math ----------
// Returns everything in integer cents.
function computeTotals(t){
  const cats = ['C','S','SH'];
  const zero = () => ({C:0,S:0,SH:0});
  const items = zero(), taxBase = zero(), fees = zero(), tax = zero(), promos = zero();
  const warnings = [];

  const lineSum = t.items.reduce((a,i) => a + num(i.lineTotal), 0);

  // ownership fractions for one item (qty splits; remainder stays with primary)
  function fractions(it){
    const f = {C:0,S:0,SH:0};
    if(it.split){
      const q = Math.max(1, num(it.qty) || 1);
      let assigned = 0;
      for(const c of cats){
        const n = Math.max(0, Math.min(q, num(it.split[c])));
        f[c] = n / q; assigned += n;
      }
      if(assigned > q){
        const tot = f.C + f.S + f.SH;
        for(const c of cats) f[c] /= tot;   // over-assigned: normalize
        warnings.push(`"${it.name}" split adds to more than its quantity — proportions were scaled.`);
      }else if(assigned < q){
        f[it.assign] += (q - assigned) / q; // remainder stays with primary pick
      }
    }else{
      f[it.assign] = 1;
    }
    return f;
  }

  const itemFr = {};
  for(const it of t.items){
    const f = fractions(it); itemFr[it.id] = f;
    const amt = num(it.lineTotal);
    for(const c of cats){
      items[c] += amt * f[c];
      if(it.taxable) taxBase[c] += amt * f[c];
    }
  }

  // fees + tip: proportional to each person's pre-tax item total
  const feeTotal = num(t.fees.service) + num(t.fees.delivery) + num(t.fees.tip)
                 + (t.fees.other || []).reduce((a,o) => a + num(o.amount), 0);
  if(lineSum > 0){
    for(const c of cats) fees[c] = feeTotal * items[c] / lineSum;
  }else{
    fees.C = feeTotal;
  }

  // tax: receipt's actual tax spread across taxable items proportionally
  const taxTotal = num(t.tax);
  const taxBaseSum = taxBase.C + taxBase.S + taxBase.SH;
  if(taxTotal > 0){
    if(taxBaseSum > 0){
      for(const c of cats) tax[c] = taxTotal * taxBase[c] / taxBaseSum;
    }else if(lineSum > 0){
      for(const c of cats) tax[c] = taxTotal * items[c] / lineSum;
      warnings.push('Receipt shows tax but no item is marked taxable — tax was spread across all items. Tap the TAX chip on the taxable items.');
    }else{
      tax.C = taxTotal;
    }
  }

  // promos / discounts
  let promoTotal = 0;
  for(const p of (t.promos || [])){
    const amt = Math.abs(num(p.amount));
    promoTotal += amt;
    if(p.mode === 'C' || p.mode === 'S' || p.mode === 'SH'){
      promos[p.mode] += amt;
    }else if(p.mode === 'split'){
      let s = Math.max(0, num(p.splitS)), sh = Math.max(0, num(p.splitSH));
      if(s + sh > amt && (s + sh) > 0){
        const f = amt / (s + sh); s *= f; sh *= f;
        warnings.push(`"${p.label}" split exceeds the discount amount — Steph/Shared portions were scaled down.`);
      }
      promos.S += s; promos.SH += sh; promos.C += amt - s - sh;
    }else if(p.mode === 'items'){
      const sel = t.items.filter(i => (p.itemIds || []).includes(i.id));
      const selSum = sel.reduce((a,i) => a + num(i.lineTotal), 0);
      if(sel.length && selSum > 0){
        for(const it of sel){
          const share = amt * num(it.lineTotal) / selSum;
          const f = itemFr[it.id];
          for(const c of cats) promos[c] += share * f[c];
        }
      }else{
        promos.C += amt;
        if(sel.length === 0) warnings.push(`"${p.label}" is set to apply to specific items but none are selected — it went to Collin.`);
      }
    }else{
      promos.C += amt;
    }
  }

  // round to cents; pin the rounded sum to the computed grand total
  const computedTotal = lineSum + feeTotal + taxTotal - promoTotal;
  const out = {};
  for(const c of cats){
    out[c] = Math.round((items[c] + fees[c] + tax[c] - promos[c]) * 100);
  }
  const drift = Math.round(computedTotal * 100) - (out.C + out.S + out.SH);
  if(drift !== 0){
    // absorb penny drift into the largest bucket (usually Collin)
    let big = 'C';
    for(const c of cats) if(Math.abs(out[c]) > Math.abs(out[big])) big = c;
    out[big] += drift;
  }

  const r = o => ({C:Math.round(o.C*100), S:Math.round(o.S*100), SH:Math.round(o.SH*100)});
  return {
    totals: out,
    detail: { items:r(items), fees:r(fees), tax:r(tax), promos:r(promos) },
    lineSum: Math.round(lineSum*100),
    feeTotal: Math.round(feeTotal*100),
    taxTotal: Math.round(taxTotal*100),
    promoTotal: Math.round(promoTotal*100),
    computedTotal: Math.round(computedTotal*100),
    receiptTotal: Math.round(num(t.total)*100),
    warnings
  };
}

// clipboard strings — sheet layout: A=Shared $, B=Shared desc, C=Steph $, D=Steph desc
function itemShortName(it){
  let n = String(it.shortName || '').trim();
  if(!n){
    n = String(it.name || 'Item').split(/[,(]/)[0].trim();
    n = n.split(/\s+/).slice(-2).join(' ');
  }
  return n.charAt(0).toUpperCase() + n.slice(1);
}

// last word of a short name, e.g. "Protein waffles" -> "waffles"
function tinyName(n){
  const w = String(n).trim().split(/\s+/);
  return w[w.length - 1];
}
// lowercase a generic name's first letter; leave brand-ish names (inner caps) alone
function decap(n){
  return /[A-Z]/.test(n.slice(1)) ? n : n.charAt(0).toLowerCase() + n.slice(1);
}
function recap(n){ return n.charAt(0).toUpperCase() + n.slice(1); }

// description for one person's sheet row: manual override if typed, else built
// from that person's assigned items. Degrades gracefully into the 29-char
// sheet limit: full names -> first full + rest tiny -> all tiny -> prefix "+".
function tripDesc(t, cat){
  const manual = String(t.description || '').trim();
  if(manual) return manual;
  const names = [];
  for(const it of (t.items || [])){
    const inCat = it.split ? num(it.split[cat]) > 0 : it.assign === cat;
    if(!inCat) continue;
    const n = itemShortName(it);
    if(!names.some(x => x.toLowerCase() === n.toLowerCase())) names.push(n);
  }
  if(!names.length) return '';
  const LIMIT = 29;
  const fulls  = names.map((n, i) => i === 0 ? recap(n) : decap(n));
  const tinies = names.map((n, i) => i === 0 ? recap(tinyName(n)) : decap(tinyName(n)));
  const join = parts => parts.join(', ');
  const attempts = [
    fulls,
    fulls.map((n, i) => i === 0 ? n : tinies[i]),
    tinies
  ];
  for(const parts of attempts){
    if(join(parts).length <= LIMIT) return join(parts);
  }
  // nothing fits whole: longest prefix plus "+". Try starting with the full
  // first name and with its tiny form; keep whichever fits MORE items.
  const greedy = first => {
    if(first.length + 1 > LIMIT) return null;
    let parts = [first];
    for(let i = 1; i < names.length; i++){
      const cand = [...parts, tinies[i]];
      if(join(cand).length + 1 <= LIMIT) parts = cand; else break;
    }
    return parts;
  };
  const a = greedy(fulls[0]), b = greedy(tinies[0]);
  const parts = (b && (!a || b.length > a.length)) ? b : (a || [tinies[0].slice(0, LIMIT - 1)]);
  let out = join(parts);
  if(parts.length < names.length) out += '+';
  return out.length <= LIMIT ? out : out.slice(0, LIMIT - 1).trim() + '+';
}

function rowStrings(t){
  const r = computeTotals(t);
  return {
    shared:  money(r.totals.SH) + '\t' + tripDesc(t, 'SH'),
    steph:   money(r.totals.S) + '\t' + tripDesc(t, 'S'),
    fullRow: money(r.totals.SH) + '\t' + tripDesc(t, 'SH') + '\t' + money(r.totals.S) + '\t' + tripDesc(t, 'S')
  };
}

// ---------- AI parsing ----------
const PARSE_SCHEMA = {
  type:'object', additionalProperties:false,
  required:['store','date','synopsis','items','fees','promos','tax','subtotal','total','notes'],
  properties:{
    store:{type:'string', description:'Store name, e.g. "Aldi", "Pick \'n Save", "Walmart". Best guess from branding. Use the specific store banner shown (e.g. "Metro Market"), never the parent company (e.g. "Kroger").'},
    synopsis:{type:'string', description:'Summary of what was bought, 29 characters max including spaces, starting with a capital letter, e.g. "Snacks + paper goods". NO store name, NO date.'},
    date:{type:'string', description:'Order/receipt date as "M/D" with no leading zeros if visible anywhere, else empty string.'},
    items:{type:'array', items:{
      type:'object', additionalProperties:false,
      required:['name','short_name','qty','line_total','taxable','tax_reason'],
      properties:{
        name:{type:'string', description:'Product name as shown, size suffix ok.'},
        short_name:{type:'string', description:'Generic 1-2 word label for the item, capitalized first word, e.g. "Protein coffee", "Cheese sticks", "Protein waffles", "Chicken tenders". Prefer the category noun over brand or flavor.'},
        qty:{type:'integer', description:'Quantity for this line.'},
        line_total:{type:'number', description:'Price for the whole line (qty included). Use the sale price when struck through by a store sale — but if the markdown comes from an order-level promo code that also appears as its own discount line in the summary, use the ORIGINAL price so the promo is not counted twice.'},
        taxable:{type:'boolean', description:'Wisconsin sales-tax guess for this item.'},
        tax_reason:{type:'string', description:'Very short reason, e.g. "grocery food - exempt", "candy - taxable".'}
      }
    }},
    fees:{type:'object', additionalProperties:false,
      required:['service','delivery','tip','other'],
      properties:{
        service:{type:'number', description:'Service fee, 0 if none.'},
        delivery:{type:'number', description:'Delivery fee actually charged (0 if free/waived).'},
        tip:{type:'number', description:'Tip, 0 if none.'},
        other:{type:'array', items:{
          type:'object', additionalProperties:false, required:['label','amount'],
          properties:{ label:{type:'string'}, amount:{type:'number'} }
        }, description:'Other fees like bag fee or heavy order fee.'}
      }
    },
    promos:{type:'array', items:{
      type:'object', additionalProperties:false, required:['label','amount'],
      properties:{
        label:{type:'string', description:'Short label, e.g. "$10 off any store".'},
        amount:{type:'number', description:'Discount amount as a POSITIVE number.'}
      }
    }, description:'Discounts/credits applied to THIS order. Exclude next-order offers.'},
    tax:{type:'number', description:'Sales tax charged on this order; 0 if no tax line.'},
    subtotal:{type:'number', description:'Item subtotal shown (final, after item sale prices); 0 if not visible.'},
    total:{type:'number', description:'Final charged total; 0 if not visible.'},
    notes:{type:'string', description:'Anything ambiguous, unreadable, or worth flagging to the user. Empty string if nothing.'}
  }
};

const PARSE_PROMPT = `These screenshots are from one grocery order (Instacart, a store app, or a paper receipt photo). Extract the order into the JSON schema. Rules:

- Screenshots may be scrolled captures of the SAME order with overlapping rows — deduplicate those; an identical row seen in two overlapping captures is one line.
- BUT the same product can legitimately appear on multiple lines (e.g. under "shopped" AND again as a substitution or added item). Those are NOT duplicates — merge them into ONE item whose qty and line_total are the TOTALS across those lines (e.g. 2 + 2 substituted = qty 4 at the combined price).
- Substitutions: record ONLY the product actually delivered and charged. Substitution rows often show the originally ordered item's name or flavor (e.g. "Flavor: Vanilla" when Vanilla was out of stock and replaced) — ignore the ordered variant entirely: never append it to the name, and if the delivered substitute is the same product as another line, that is ONE merged item (summed qty and price). Exclude unavailable/refunded items that were not charged.
- One screenshot may be a checkout/summary view — use it for fees, tip, delivery, promos, tax, and total.
- line_total is the price charged for the whole line at the shown quantity. When a price is struck through next to a highlighted price because of a store sale, use the highlighted (sale) price. In Instacart carts, the price under the product name is already the line total for the quantity shown.
- EXCEPTION — promo codes: if item markdowns are attributed to a promo/coupon code (e.g. "$1.86 from FAST30 promo code") AND the order summary lists that code as one combined discount line (e.g. "FAST30 promo code −$10.04"), record each item at its ORIGINAL pre-promo price and record the promo once in promos. Items must sum to the pre-promo subtotal. Never subtract the same promo twice.
- Delivery shown as $0.00 (e.g. free with Instacart+) = 0. Ignore the crossed-out original fee.
- Promos: only discounts applied to this order (negative lines in the summary), recorded as positive amounts. IGNORE banners about credits or offers "on your next order".
- Wisconsin taxability guess per item: unprepared grocery food is exempt; candy, soft drinks/soda, prepared or hot food, dietary supplements, alcohol, pet food, and non-food items (paper, cleaning, health & beauty) are taxable.
- date: only if a date is actually visible; else empty string.
- synopsis: a short plain-language summary of the items bought, 29 characters MAX including spaces, starting with a capital letter (e.g. "Produce + snacks", "Diapers, wipes, formula"). Cover the gist of the whole order, most notable items first. Never include the store name or the date.
- short_name per item: a generic 1-2 word label, category noun over brand/flavor ("Cheese sticks" not "Kraft Big Stick"; "Protein coffee" not "Free Rein Cold Brew"). Two items that are variants of the same thing get the SAME short_name (e.g. both waffle flavors = "Protein waffles").
- VERIFY BEFORE ANSWERING (works for any store): (a) your item line_totals should sum to the shown subtotal; (b) subtotal − promos + fees + tip + tax should equal the shown total. If a check fails, re-examine the screenshots for missed items, misread prices, uncounted substitutions, or double-counted discounts, and correct your extraction. Only if it still won't balance, state the exact leftover amount and your best guess why in notes (e.g. "items are $6.56 short of subtotal — a line may be cut off above the visible area").
- If anything is unreadable or ambiguous, say so in notes.`;

async function parseScreenshots(dataUrls){
  const content = dataUrls.map(u => {
    const m = u.match(/^data:(image\/\w+);base64,(.*)$/s);
    return { type:'image', source:{ type:'base64', media_type:m[1], data:m[2] } };
  });
  content.push({ type:'text', text: PARSE_PROMPT });

  const body = {
    model: settings.model,
    max_tokens: 16000,
    output_config: { format: { type:'json_schema', schema: PARSE_SCHEMA } },
    messages: [{ role:'user', content }]
  };

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': settings.apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify(body)
  });
  let json;
  try{ json = await resp.json(); }
  catch{ throw new Error('The response was cut off mid-download — usually a brief connection hiccup. Just try again.'); }
  if(json.type === 'error') throw new Error(json.error?.message || 'API error');
  if(json.stop_reason === 'refusal') throw new Error('The model declined this request. Try again.');
  if(json.stop_reason === 'max_tokens') throw new Error('The answer ran out of room before finishing. Try again, or split the order into fewer screenshots per parse.');
  const textBlock = (json.content || []).find(b => b.type === 'text');
  if(!textBlock) throw new Error('No text in response.');
  try{ return JSON.parse(textBlock.text); }
  catch{ throw new Error('The model returned an incomplete answer — this is transient. Try again.'); }
}

function buildTrip(p){
  const today = new Date();
  const dateStr = (p.date && p.date.trim()) ? p.date.trim() : `${today.getMonth()+1}/${today.getDate()}`;
  const store = (p.store || 'Store').trim();
  let synopsis = (p.synopsis || '').trim();
  if(synopsis) synopsis = synopsis.charAt(0).toUpperCase() + synopsis.slice(1);
  const createdAt = Date.now();
  // description stays empty: sheet rows auto-build from each person's items
  // (tripDesc); typing in the description field overrides both rows.
  return {
    id: uid(), createdAt, updatedAt: createdAt, store, dateStr, description: '', synopsis,
    items: (p.items || []).map(i => ({
      id: uid(), name: i.name || 'Item', shortName: (i.short_name || '').trim(),
      qty: Math.max(1, Math.round(num(i.qty) || 1)),
      lineTotal: round2(i.line_total),
      taxable: !!i.taxable, taxReason: i.tax_reason || '',
      assign: 'C', split: null
    })),
    fees: {
      service: round2(p.fees && p.fees.service), delivery: round2(p.fees && p.fees.delivery),
      tip: round2(p.fees && p.fees.tip),
      other: ((p.fees && p.fees.other) || []).map(o => ({ label:o.label || 'Fee', amount: round2(o.amount) }))
    },
    promos: (p.promos || []).map(o => ({
      id: uid(), label: o.label || 'Discount', amount: Math.abs(round2(o.amount)),
      mode: 'C', splitS: 0, splitSH: 0, itemIds: []
    })),
    tax: round2(p.tax), subtotal: round2(p.subtotal), total: round2(p.total),
    notes: p.notes || ''
  };
}

// ---------- image handling ----------
function readFileAsDataUrl(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(new Error('Could not read file'));
    fr.readAsDataURL(file);
  });
}
function loadImage(url){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('Could not load image'));
    img.src = url;
  });
}
async function compressImage(file){
  const url = await readFileAsDataUrl(file);
  const img = await loadImage(url);
  const MAX = 1568;
  const scale = Math.min(1, MAX / Math.max(img.width, img.height));
  const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.85);
}

// ---------- optional sync ----------
function syncBase(){
  return String(settings.syncUrl || '').trim().replace(/\/+$/, '');
}

function isSyncOn(){
  return syncBase().length > 0 && String(settings.syncToken || '').trim().length > 0;
}

function syncHeaders(contentType){
  const headers = { Authorization: `Bearer ${String(settings.syncToken || '').trim()}` };
  if(contentType) headers['content-type'] = contentType;
  return headers;
}

function saveSyncRev(){
  try{ localStorage.setItem('gt_sync_rev', String(syncRev)); }
  catch(e){ /* local sync metadata is best effort */ }
}

function saveSyncState(){
  try{ localStorage.setItem('gt_sync_state', JSON.stringify(syncState)); }
  catch(e){ /* status is best effort */ }
}

function syncAgeLabel(at){
  const seconds = Math.max(0, Math.floor((Date.now() - at) / 1000));
  if(seconds < 60) return 'just now';
  const minutes = Math.floor(seconds / 60);
  if(minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  if(hours < 24) return `${hours}h ago`;
  return `${Math.floor(hours / 24)}d ago`;
}

function syncStatusText(){
  if(syncState.lastError) return `Sync error: ${syncState.lastError}`;
  if(syncState.lastSyncAt) return `Synced ${syncAgeLabel(syncState.lastSyncAt)}`;
  return isSyncOn() ? 'Not synced yet' : 'Sync off';
}

function updateSyncStatus(){
  const el = $('syncStatus');
  if(el) el.textContent = syncStatusText();
}

function markSyncSuccess(){
  syncState.lastSyncAt = Date.now();
  syncState.lastError = '';
  saveSyncState();
  updateSyncStatus();
}

function syncErrorMessage(error){
  const message = error && error.message ? error.message : String(error || 'request failed');
  return message.replace(/\s+/g, ' ').slice(0, 180);
}

function reportSyncError(error, context = ''){
  const message = `${context ? context + ': ' : ''}${syncErrorMessage(error)}`;
  syncState.lastError = message;
  saveSyncState();
  updateSyncStatus();
  console.warn('[Grocery Splitter sync]', message);
}

async function requireSyncOk(response){
  if(response.ok) return;
  let message = `HTTP ${response.status}`;
  try{
    const body = await response.json();
    if(body && body.error) message = String(body.error);
  }catch(e){ /* keep the HTTP status */ }
  throw new Error(message);
}

function schedulePush(){
  if(!isSyncOn()) return;
  clearSyncPushTimer();
  syncPushTimer = setTimeout(() => {
    syncPushTimer = null;
    void push();
  }, 2000);
}

function clearTripImageUrls(images){
  for(const url of Array.isArray(images) ? images : []){
    if(typeof url === 'string' && url.startsWith('blob:') && typeof URL !== 'undefined' && typeof URL.revokeObjectURL === 'function'){
      URL.revokeObjectURL(url);
    }
  }
}

function clearTripImages(id){
  if(!hasTripImages(id)) return;
  clearTripImageUrls(tripImages[id]);
  delete tripImages[id];
}

async function dataUrlToBlob(dataUrl){
  if(!isSyncOn()) return null;
  const response = await fetch(dataUrl);
  if(!response.ok) throw new Error('Could not read screenshot');
  return response.blob();
}

async function uploadTripScreenshot(tripId, number, dataUrl){
  if(!isSyncOn() || !tripById(tripId)) return;
  const blob = await dataUrlToBlob(dataUrl);
  if(!blob || !isSyncOn() || !tripById(tripId)) return;
  const response = await fetch(`${syncBase()}/screenshots/${encodeURIComponent(tripId)}/${number}`, {
    method:'PUT', headers:syncHeaders('image/jpeg'), body:blob
  });
  await requireSyncOk(response);
}

function uploadTripScreenshots(tripId, images){
  if(!isSyncOn() || !Array.isArray(images)) return;
  const list = images.slice(0, 10);
  if(!list.length) return;
  void Promise.all(list.map((dataUrl, i) => uploadTripScreenshot(tripId, i, dataUrl)))
    .then(() => { if(isSyncOn()) markSyncSuccess(); })
    .catch(error => reportSyncError(error, 'Screenshot upload'));
}

async function loadTripScreenshots(tripId){
  if(!isSyncOn()) return;
  const prior = tripScreenshotLoadInFlight.get(tripId);
  if(prior) return prior;
  if(hasTripImages(tripId)) return;

  const run = (async () => {
    const urls = [];
    try{
      for(let i = 0; i < 10; i++){
        if(!isSyncOn()){
          clearTripImageUrls(urls);
          return;
        }
        const response = await fetch(`${syncBase()}/screenshots/${encodeURIComponent(tripId)}/${i}`, {
          headers:syncHeaders()
        });
        if(response.status === 404) break;
        await requireSyncOk(response);
        urls.push(URL.createObjectURL(await response.blob()));
      }
      if(!isSyncOn() || hasTripImages(tripId) || !tripById(tripId)){
        clearTripImageUrls(urls);
        return;
      }
      tripImages[tripId] = urls;
      if(currentView === 'trip' && currentTripId === tripId){
        if(isUserEditing()) syncRenderPending = true;
        else renderTrip(tripId);
      }
      markSyncSuccess();
    }catch(error){
      clearTripImageUrls(urls);
      reportSyncError(error, 'Screenshot download');
    }
  })();
  tripScreenshotLoadInFlight.set(tripId, run);
  try{ return await run; }
  finally{
    if(tripScreenshotLoadInFlight.get(tripId) === run) tripScreenshotLoadInFlight.delete(tripId);
  }
}

async function deleteTripScreenshots(tripId){

    });

  }catch(error){
    reportSyncError(error, 'Screenshot delete');
  }
}

async function pullMerge(){
  if(!isSyncOn()) return { ok:false, changed:false, needsPush:false };
  if(syncPullInFlight) return syncPullInFlight;

  const run = (async () => {
    try{
      if(!isSyncOn()) return { ok:false, changed:false, needsPush:false };
      const response = await fetch(`${syncBase()}/trips`, { headers:syncHeaders() });
      await requireSyncOk(response);
      const remote = await response.json();
      if(!remote || !Array.isArray(remote.trips) || !Array.isArray(remote.tombstones) || !Number.isFinite(Number(remote.rev))){
        throw new Error('Invalid /trips response');
      }

      const localTrips = trips.filter(t => t && t.id != null).map(t => ensureTripUpdatedAt(t));
      const localTombstones = dedupeTombstones(tombstones);
      const remoteTrips = remote.trips.filter(t => t && t.id != null).map(t => ensureTripUpdatedAt(t));
      const remoteTombstones = dedupeTombstones(remote.tombstones);
      const remoteDeleted = new Set(remoteTombstones.map(t => t.id));
      const remoteEffectiveTrips = remoteTrips.filter(t => !remoteDeleted.has(String(t.id)));

      const order = [];
      const candidates = new Map();
      const addCandidate = trip => {
        const id = String(trip.id);
        if(!order.includes(id)) order.push(id);
        const prior = candidates.get(id);
        if(!prior || tripUpdatedAt(trip) > tripUpdatedAt(prior)) candidates.set(id, trip);
      };
      for(const trip of localTrips) addCandidate(trip);
      for(const trip of remoteTrips) addCandidate(trip);

      const mergedTombstones = dedupeTombstones([...localTombstones, ...remoteTombstones]);
      const deleted = new Set(mergedTombstones.map(t => t.id));
      const mergedTrips = order.map(id => candidates.get(id)).filter(t => t && !deleted.has(String(t.id)));
      const currentSignature = syncStateSignature(localTrips, localTombstones);
      const mergedSignature = syncStateSignature(mergedTrips, mergedTombstones);
      const remoteSignature = syncStateSignature(remoteEffectiveTrips, remoteTombstones);
      const dataChanged = currentSignature !== mergedSignature;
      const needsPush = mergedSignature !== remoteSignature;

      const beforeIds = new Set(localTrips.map(t => String(t.id)));
      trips = mergedTrips;
      tombstones = mergedTombstones;
      syncRev = Number(remote.rev);
      saveSyncRev();
      if(dataChanged){
        for(const id of beforeIds){
          if(!trips.some(t => String(t.id) === id)) clearTripImages(id);
        }
        persist({ stampChanges:false });
        if(isUserEditing()) syncRenderPending = true;
        else{
          syncRenderPending = false;
          rerenderCurrentScreen();
        }
      }
      if(needsPush) schedulePush();
      markSyncSuccess();
      return { ok:true, changed:dataChanged, needsPush };
    }catch(error){
      reportSyncError(error, 'Trip pull');
      return { ok:false, changed:false, needsPush:false };
    }
  })();
  syncPullInFlight = run;
  try{ return await run; }
  finally{ if(syncPullInFlight === run) syncPullInFlight = null; }
}

async function push(){
  if(!isSyncOn()) return false;
  if(syncPushInFlight) return syncPushInFlight;
  clearSyncPushTimer();

  const run = (async () => {
    try{
      if(!isSyncOn()) return false;
      const pullResult = await pullMerge();
      if(!pullResult.ok) return false;
      clearSyncPushTimer();
      const priorRev = Number.isFinite(syncRev) && syncRev >= 0 ? syncRev : 0;
      const nextRev = priorRev + 1;
      const payload = {
        trips: trips.map(t => ensureTripUpdatedAt(t)),
        tombstones: dedupeTombstones(tombstones),
        rev: nextRev
      };
      const response = await fetch(`${syncBase()}/trips`, {
        method:'PUT', headers:syncHeaders('application/json'), body:JSON.stringify(payload)
      });
      await requireSyncOk(response);
      syncRev = nextRev;
      saveSyncRev();
      markSyncSuccess();
      return true;
    }catch(error){
      reportSyncError(error, 'Trip push');
      return false;
    }
  })();
  syncPushInFlight = run;
  try{ return await run; }
  finally{ if(syncPushInFlight === run) syncPushInFlight = null; }
}

async function syncNow(){
  if(!isSyncOn()) return;
  if(syncNowInFlight) return syncNowInFlight;
  const run = (async () => {
    const result = await pullMerge();
    flushPendingSyncRender();
    if(result.ok && (result.changed || result.needsPush)) await push();
    flushPendingSyncRender();
  })();
  syncNowInFlight = run;
  try{ await run; }
  catch(error){ reportSyncError(error, 'Sync'); }
  finally{ if(syncNowInFlight === run) syncNowInFlight = null; }
}

        <span class="money">${money(r.totals.C + r.totals.S + r.totals.SH)}</span></div>
      <details>
        <summary>Calculation details</summary>
        <div class="tablewrap"><table class="bd">
          <tr><th></th><th>Collin</th><th>Shared</th><th>Steph</th></tr>
          <tr><td>Items</td><td>${money(r.detail.items.C)}</td><td>${money(r.detail.items.SH)}</td><td>${money(r.detail.items.S)}</td></tr>
          <tr><td>Fees &amp; tip</td><td>${money(r.detail.fees.C)}</td><td>${money(r.detail.fees.SH)}</td><td>${money(r.detail.fees.S)}</td></tr>
          <tr><td>Tax</td><td>${money(r.detail.tax.C)}</td><td>${money(r.detail.tax.SH)}</td><td>${money(r.detail.tax.S)}</td></tr>
          <tr><td>Discounts</td><td>−${money(r.detail.promos.C)}</td><td>−${money(r.detail.promos.SH)}</td><td>−${money(r.detail.promos.S)}</td></tr>
          <tr><td>Total</td><td>${money(r.totals.C)}</td><td>${money(r.totals.SH)}</td><td>${money(r.totals.S)}</td></tr>
        </table></div>
      </details>
    </div>

    <div class="stickybar"><div class="inner">
      <div class="tots">
        <span><span class="dot dot-C"></span>${money(r.totals.C)}</span>
        <span><span class="dot dot-SH"></span>${money(r.totals.SH)}</span>
        <span><span class="dot dot-S"></span>${money(r.totals.S)}</span>
      </div>
    </div></div>`;
}

function splitNote(it){
  const q = Math.max(1, num(it.qty));
  const assigned = num(it.split.C) + num(it.split.S) + num(it.split.SH);
  if(assigned < q) return `${q - assigned} of ${q} unassigned; they stay with ${CAT_LABEL[it.assign]}.`;
  if(assigned > q) return `${assigned} assigned; quantity is ${q}.`;
  return `All ${q} assigned.`;
}

function rerenderTrip(){ if(currentTripId) renderTrip(currentTripId); }

function rerenderCurrentScreen(){
  if(currentView === 'trip' && currentTripId) renderTrip(currentTripId);
  else if(currentView === 'settings') renderSettings();
  else if(currentView === 'new') renderNew();
  else renderHome();
}

function flushPendingSyncRender(){
  if(!syncRenderPending || isUserEditing()) return;
  syncRenderPending = false;
  rerenderCurrentScreen();
}

// ---------- actions ----------
const A = {
  goHome(){ this.commitOpenItemPrice(); editItemId = editPromoId = null; syncRenderPending = false; renderHome(); },
  goSettings(){ renderSettings(); },
  goNew(){ pendingImages = []; renderNew(); },
  openTrip(id){ this.commitOpenItemPrice(); editItemId = editPromoId = null; syncRenderPending = false; renderTrip(id); },

  // settings
  toggleKey(){ const i = $('apiKey'); i.type = i.type === 'password' ? 'text' : 'password'; },
  toggleSyncToken(){ const i = $('syncToken'); i.type = i.type === 'password' ? 'text' : 'password'; },
  saveSettings(){
    const priorSyncTarget = `${syncBase()}\n${String(settings.syncToken || '').trim()}`;
    settings.apiKey = $('apiKey').value.trim();
    settings.model = $('model').value;
    settings.syncUrl = $('syncUrl').value.trim().replace(/\/+$/, '');
    settings.syncToken = $('syncToken').value.trim();
    const nextSyncTarget = `${syncBase()}\n${settings.syncToken}`;
    if(priorSyncTarget !== nextSyncTarget){
      syncRev = 0;
      saveSyncRev();
      syncState.lastSyncAt = 0;
      syncState.lastError = '';
      saveSyncState();
    }
    persist(); toast('Saved'); renderHome();
    if(isSyncOn()) void syncNow();
  },
  async testKey(){
    const out = $('testResult');
    const key = $('apiKey').value.trim();
    const model = $('model').value;
    if(!key){ out.textContent = 'Enter a key first'; return; }
    out.textContent = 'Testing…';
    try{
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{ 'content-type':'application/json', 'x-api-key':key,
          'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
        body: JSON.stringify({ model, max_tokens:1, messages:[{role:'user', content:'hi'}] })
      });
      const j = await r.json();
      out.textContent = (j.type === 'error') ? ('Error: ' + (j.error?.message || 'request failed')) : 'Key verified';
    }catch(e){ out.textContent = 'Network error. Check your connection.'; }
  },

  // new trip images
  selectImages(input){
    if(parsing){ input.value = ''; toast('Hold on — still analyzing'); return; }
    const files = Array.from(input.files || []);
    input.value = '';
    this.addImages(files);
  },
  dragEnter(e){
    e.preventDefault();
    newTripDragDepth++;
    e.currentTarget.classList.add('dragging');
  },
  dragOver(e){
    e.preventDefault();
    if(e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
  },
  dragLeave(e){
    newTripDragDepth = Math.max(0, newTripDragDepth - 1);
    if(!newTripDragDepth) e.currentTarget.classList.remove('dragging');
  },
  dropImages(e){
    e.preventDefault();
    newTripDragDepth = 0;
    e.currentTarget.classList.remove('dragging');
    if(parsing){ toast('Hold on — still analyzing'); return; }
    const dropped = Array.from(e.dataTransfer?.files || []);
    const images = dropped.filter(f => f.type.startsWith('image/'));
    if(dropped.length && !images.length){ toast('Drop image files only'); return; }
    this.addImages(images);
  },
  async addImages(files){
    if(!files || !files.length) return;
    try{
      for(const f of Array.from(files)) pendingImages.push(await compressImage(f));
    }catch(e){ toast('Could not read an image'); }
    renderNew();
  },
  removeImage(i){
    if(parsing){ toast('Hold on — still analyzing'); return; }
    pendingImages.splice(i, 1); renderNew();
  },
  openPendingImage(i){ openLightbox(pendingImages[i], `Screenshot ${i+1}`); },
  openTripImage(tripId, i){ openLightbox(tripImages[tripId]?.[i], `Screenshot ${i+1}`); },
  closeLightbox(){ closeLightbox(); },

  async parse(){
    if(parsing){ toast('Hold on — still analyzing'); return; }
    parsing = true;
    let btn, st, tick;
    try{
      btn = $('parseBtn'); st = $('parseStatus');
      btn.disabled = true;
      const msgs = ['Reading screenshots…', 'Identifying items and prices…', 'Checking fees, tip, and tax…'];
      let mi = 0;
      st.innerHTML = `<div class="banner banner-info"><span class="spin"></span><span id="pmsg">${msgs[0]}</span></div>`;
      tick = setInterval(() => { mi = (mi+1) % msgs.length; const el = $('pmsg'); if(el) el.textContent = msgs[mi]; }, 4000);
      const parsed = await parseScreenshots(pendingImages);
      const t = buildTrip(parsed);
      trips.unshift(t); persist();
      tripImages[t.id] = pendingImages.slice();
      uploadTripScreenshots(t.id, tripImages[t.id]);
      pendingImages = [];
      renderTrip(t.id);
      toast('Trip ready');
    }catch(e){
      btn.disabled = false;
      st.innerHTML = `<div class="banner banner-err"><b>Unable to read the screenshots.</b><br>${esc(e.message)}</div>`;
    }finally{
      clearInterval(tick);
      parsing = false;
    }
  },

  // trip-level
  deleteTrip(id){
    if(!confirm('Delete this trip? The Google Sheet is unaffected.')) return;
    clearTripImages(id);
    tombstones.push({ id, deletedAt:Date.now() });
    trips = trips.filter(t => t.id !== id); persist();
    void deleteTripScreenshots(id);
    renderHome();
  },
  clearNotes(){ const t = tripById(currentTripId); if(t){ t.notes = ''; persist(); rerenderTrip(); } },
  renameStore(){
    const t = tripById(currentTripId); if(!t) return;
    const v = prompt('Store name', t.store); if(v === null) return;
    const name = v.trim();
    if(!name || name === t.store) return;
    t.store = name; persist(); rerenderTrip();
  },
  descChanged(v){
    const t = tripById(currentTripId); if(!t) return;
    t.description = v.slice(0, 29); persist();
    const c = $('descCount'); if(c) c.textContent = t.description.length + '/29';
    // update the output row descriptions in place (no re-render → keeps focus)
    document.querySelectorAll('.outdesc').forEach(el => { el.textContent = tripDesc(t, el.dataset.cat); });
  },

  // items
  assign(itemId, cat){
    const t = tripById(currentTripId); const it = t && t.items.find(i => i.id === itemId); if(!it) return;
    it.assign = cat; persist(); rerenderTrip();
  },
  toggleTax(itemId){
    const t = tripById(currentTripId); const it = t && t.items.find(i => i.id === itemId); if(!it) return;
    it.taxable = !it.taxable; persist(); rerenderTrip();
  },
  startSplit(itemId){
    const t = tripById(currentTripId); const it = t && t.items.find(i => i.id === itemId); if(!it) return;
    it.split = { C:0, S:0, SH:0 };
    it.split[it.assign] = it.qty;
    persist(); rerenderTrip();
  },
  stepSplit(itemId, cat, d){
    const t = tripById(currentTripId); const it = t && t.items.find(i => i.id === itemId); if(!it || !it.split) return;
    const q = Math.max(1, num(it.qty));
    const others = ['C','S','SH'].filter(c => c !== cat).reduce((a,c) => a + num(it.split[c]), 0);
    it.split[cat] = Math.max(0, Math.min(q - others, num(it.split[cat]) + d));
    persist(); rerenderTrip();
  },
  removeSplit(itemId){
    const t = tripById(currentTripId); const it = t && t.items.find(i => i.id === itemId); if(!it) return;
    it.split = null; persist(); rerenderTrip();
  },
  startEditItem(id){ this.commitOpenItemPrice(); editItemId = id; editPromoId = null; syncRenderPending = false; rerenderTrip(); },
  doneEditItem(){ this.commitOpenItemPrice(); editItemId = null; syncRenderPending = false; rerenderTrip(); },
  priceFocus(el){
    el.dataset.priceOriginal = el.value;
    el.dataset.priceDigits = '';
    el.dataset.priceTyped = '0';
    el.value = '';
  },
  priceInput(el){
    const digits = el.value.replace(/\D/g, '').slice(0, 7);
    el.dataset.priceDigits = digits;
    el.dataset.priceTyped = '1';
    el.value = digits ? (parseInt(digits, 10) / 100).toFixed(2) : '';
  },
  commitItemPrice(el){
    if(!el) return false;
    if(el.dataset.priceTyped !== '1'){
      el.value = el.dataset.priceOriginal || el.value;
      return false;
    }
    const digits = el.dataset.priceDigits || '';
    if(!digits){
      el.value = el.dataset.priceOriginal || el.value;
      el.dataset.priceTyped = '0';
      return false;
    }
    const cents = parseInt(digits, 10);
    this.editItem(el.dataset.itemPrice, 'lineTotal', cents / 100);
    el.value = (cents / 100).toFixed(2);
    el.dataset.priceOriginal = el.value;
    el.dataset.priceTyped = '0';
    return true;
  },
  commitOpenItemPrice(){
    return this.commitItemPrice(document.querySelector('[data-item-price]'));
  },
  priceBlur(el){
    const committed = this.commitItemPrice(el);
    if(committed) setTimeout(() => {
      if(currentTripId && editItemId === el.dataset.itemPrice) rerenderTrip();
    }, 0);
  },
  editItem(id, field, val){
    const t = tripById(currentTripId); const it = t && t.items.find(i => i.id === id); if(!it) return;
    if(field === 'name') it.name = val;
    if(field === 'qty'){ it.qty = Math.max(1, Math.round(num(val) || 1)); it.split = null; }
    if(field === 'lineTotal') it.lineTotal = round2(val);
    persist();
  },
  deleteItem(id){
    const t = tripById(currentTripId); if(!t) return;
    t.items = t.items.filter(i => i.id !== id);
    for(const p of t.promos) p.itemIds = (p.itemIds || []).filter(x => x !== id);
    editItemId = null; persist(); rerenderTrip();
  },
  addItem(){
    const t = tripById(currentTripId); if(!t) return;
    const it = { id:uid(), name:'New item', qty:1, lineTotal:0, taxable:false, taxReason:'', assign:'C', split:null };
    this.commitOpenItemPrice();
    t.items.push(it); editItemId = it.id; persist(); rerenderTrip();
  },

  // promos
  promoMode(pid, mode){
    const t = tripById(currentTripId); const p = t && t.promos.find(x => x.id === pid); if(!p) return;
    p.mode = mode; persist(); rerenderTrip();
  },
  promoSplit(pid, field, val){
    const t = tripById(currentTripId); const p = t && t.promos.find(x => x.id === pid); if(!p) return;
    p[field] = Math.max(0, round2(val)); persist(); rerenderTrip();
  },
  promoItemToggle(pid, itemId, on){
    const t = tripById(currentTripId); const p = t && t.promos.find(x => x.id === pid); if(!p) return;
    p.itemIds = p.itemIds || [];
    if(on && !p.itemIds.includes(itemId)) p.itemIds.push(itemId);
    if(!on) p.itemIds = p.itemIds.filter(x => x !== itemId);
    persist(); rerenderTrip();
  },
  startEditPromo(id){ this.commitOpenItemPrice(); editPromoId = id; editItemId = null; syncRenderPending = false; rerenderTrip(); },
  doneEditPromo(){ editPromoId = null; syncRenderPending = false; rerenderTrip(); },
  editPromo(id, field, val){
    const t = tripById(currentTripId); const p = t && t.promos.find(x => x.id === id); if(!p) return;
    if(field === 'label') p.label = val;
    if(field === 'amount') p.amount = Math.abs(round2(val));
    persist();
  },
  deletePromo(id){
    const t = tripById(currentTripId); if(!t) return;
    t.promos = t.promos.filter(p => p.id !== id);
    editPromoId = null; persist(); rerenderTrip();
  },
  addPromo(){
    const t = tripById(currentTripId); if(!t) return;
    const p = { id:uid(), label:'Discount', amount:0, mode:'C', splitS:0, splitSH:0, itemIds:[] };
    t.promos.push(p); editPromoId = p.id; persist(); rerenderTrip();
  },

  // fees
  editFee(path, val){
    const t = tripById(currentTripId); if(!t) return;
    const v = round2(val);
    if(path === 'tax'){ t.tax = v; }
    else if(path === 'total'){ t.total = v; }
    else if(path.startsWith('other:')){ const i = parseInt(path.slice(6), 10); if(t.fees.other[i]) t.fees.other[i].amount = v; }
    else t.fees[path] = v;
    persist(); rerenderTrip();
  },

  // outputs
  copyRow(kind){
    const t = tripById(currentTripId); if(!t) return;
    const rows = rowStrings(t);
    const labels = { shared:'Copied. Paste at column A.', steph:'Copied. Paste at column C.', fullRow:'Copied. Paste at column A.' };
    copyText(rows[kind], labels[kind]);
  }
};
window.A = A;

// test hooks (used during development; harmless in production)
window.GT = {
  get trips(){ return trips; },
  get tombstones(){ return tombstones; },
  get settings(){ return settings; },
  computeTotals, rowStrings, buildTrip, storeMarkFor, pullMerge, push, isSyncOn,
  addTrip(parsed){ const t = buildTrip(parsed); trips.unshift(t); persist(); renderTrip(t.id); return t.id; }
};

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') void syncNow();
});

renderHome();
void syncNow();
</script>
